<!DOCTYPE html>  
<html lang="pt-br">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width,initial-scale=1">  
<title>Pedidos Peçaí Sorveterias</title>  
<style>  
  
body{  
margin:0;  
background:#4b0082;  
font-family:Arial;  
color:white;  
}  
  
.box{  
max-width:700px;  
margin:auto;  
padding:30px;  
}  
  
.card{  
background:white;  
color:#4b0082;  
padding:18px;  
border-radius:18px;  
margin:12px 0;  
}  
  
input,select{  
width:100%;  
padding:14px;  
margin-top:8px;  
margin-bottom:15px;  
border-radius:10px;  
border:none;  
}  
  
button{  
width:100%;  
padding:18px;  
border:none;  
border-radius:14px;  
background:#ffd500;  
color:#4b0082;  
font-size:18px;  
font-weight:bold;  
}  
  
.hidden{  
display:none;  
}  
  
</head>  
<body>  
<div class="box">  
<h1>🍨 Pedidos Peçaí</h1>  
<div class="card">  
Loja
<select id="loja">  
<option>Macaparana</option>  
<option>Condado</option>  
<option>Aliança</option>  
</select>  
</div>  
<div class="card">  
Nome completo  
<input id="nome">
Telefone  
<input id="fone">
Endereço  
<input id="end">
Ponto referência  
<input id="ref">
</div>  
<div class="card">  
Entrega
<select id="tipo">  
<option>Entrega</option>  
<option>Retirada</option>  
</select>  
Cidade
<select id="cidade">  
<option>Macaparana</option>  
<option>São Vicente Ferrer</option>  
</select>  
</div>  
<div class="card">  
Pagamento
<select id="pag">  
<option>Pix</option>  
<option>Dinheiro</option>  
<option>Cartão Crédito</option>  
<option>Cartão Débito</option>  
</select>  
Troco para:  
<input id="troco">
</div>  
<button onclick="enviar()">  
CONTINUAR
</button>  
</div>  
<script>  
  
function enviar(){  
  
localStorage.setItem(  
"cliente",  
JSON.stringify({  
  
nome:nome.value,  
fone:fone.value,  
end:end.value,  
ref:ref.value  
  
})  
)  
  
let taxa=  
tipo.value==="Retirada"  
?0  
:cidade.value==="Macaparana"  
?3  
:10  
  
let msg=  
  
`🍨 PEDIDO PEÇAÍ  
  
Loja:  
${loja.value}  
  
Cliente:  
${nome.value}  
  
Telefone:  
${fone.value}  
  
Endereço:  
${end.value}  
  
Referência:  
${ref.value}  
  
Tipo:  
${tipo.value}  
  
Cidade:  
${cidade.value}  
  
Taxa:  
R$ ${taxa}  
  
Pagamento:  
${pag.value}  
  
Troco:  
${troco.value}`  
  
window.open(  
`https://wa.me/5581995693080?text=${encodeURIComponent(msg)}`  
)  
  
}  
  
window.onload=()=>{  
  
let c=  
JSON.parse(  
localStorage.getItem("cliente")  
)  
  
if(c){  
  
nome.value=c.nome  
fone.value=c.fone  
end.value=c.end  
ref.value=c.ref  
  
}  
  
}  
  
</body>  
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Pedidos Peçaí Sorveterias</title>

<style>

body{
margin:0;

font-family:Arial,sans-serif;

background:
radial-gradient(circle at top,#6d28d9 0%,#3d148f 35%,#17052f 100%);

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:30px;
}

.card{
max-width:460px;
width:100%;

padding:38px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(22px);

border:1px solid rgba(255,255,255,.15);

border-radius:28px;

box-shadow:
0 20px 70px rgba(0,0,0,.35);
}

h1{
text-align:center;
}

input,
select{

width:100%;

padding:18px;

margin-top:14px;

border:none;

border-radius:14px;

background:rgba(255,255,255,.95);

font-size:15px;

box-sizing:border-box;

outline:none;

}

input:focus,
select:focus{

box-shadow:
0 0 0 3px rgba(255,212,0,.35);

}

button{

width:100%;

padding:18px;

margin-top:18px;

border:none;

border-radius:14px;

background:linear-gradient(
90deg,
#ffd400,
#ffea00
);

font-weight:700;

font-size:15px;

cursor:pointer;

transition:.25s;

}

button:hover{

transform:translateY(-2px);

}

button{
background:#ffd400;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.95;
}

</style>
</head>

<body>

<div class="card">

<h1>🍨 Pedidos Peçaí</h1>

<select id="loja">
<option>Macaparana</option>
<option>Condado</option>
<option>Aliança</option>
</select>

<input id="nome" placeholder="Nome completo">

<input id="fone" placeholder="Telefone">

<input id="endereco" placeholder="Endereço">

<input id="referencia" placeholder="Ponto de referência">

<select id="tipo">
<option>Entrega</option>
<option>Retirada</option>
</select>

<select id="pagamento">
<option>Pix</option>
<option>Dinheiro</option>
<option>Cartão</option>
</select>

<input id="troco" placeholder="Troco para">

<button onclick="continuar()">
CONTINUAR
</button>

</div>

<script>

function continuar(){

const nome = document.getElementById("nome").value;

if(!nome){
alert("Informe seu nome");
return;
}

localStorage.setItem(
"cliente",
JSON.stringify({
nome: nome,
fone: document.getElementById("fone").value,
endereco: document.getElementById("endereco").value,
referencia: document.getElementById("referencia").value
})
);
  
window.location.href = "cardapio.html";

}

</script>
</body>
</html>

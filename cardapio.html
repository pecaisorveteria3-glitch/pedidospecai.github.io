<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Cardápio Peçaí</title>

<style>

body{
margin:0;
background:#4d0080;
font-family:Arial;
color:white;
}

.container{
max-width:500px;
margin:auto;
padding:20px;
}

.logo{
text-align:center;
font-size:34px;
font-weight:bold;
margin-bottom:30px;
}

.card{

background:white;
color:#333;

padding:18px;

margin-bottom:20px;

border-radius:18px;
}

.item{
display:flex;

justify-content:space-between;

padding:14px;

border-bottom:1px solid #ddd;
}

button{

width:100%;

background:#FFD500;

border:none;

padding:16px;

font-size:18px;

font-weight:bold;

border-radius:12px;

cursor:pointer;

}

.total{

font-size:24px;

text-align:center;

margin:25px;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">
🍧 Peçaí
</div>

<div class="card">

<h2>AÇAÍ</h2>

<div class="item">
300ml
<button onclick="add(14)">
R$14
</button>
</div>

<div class="item">
500ml
<button onclick="add(18)">
R$18
</button>
</div>

<div class="item">
700ml
<button onclick="add(24)">
R$24
</button>
</div>

</div>

<div class="card">

<h2>Complementos</h2>

<div class="item">
Leite condensado
<button onclick="extra(2)">+ R$2</button>
</div>

<div class="item">
Paçoca
<button onclick="extra(2)">+ R$2</button>
</div>

<div class="item">
Granola
<button onclick="extra(2)">+ R$2</button>
</div>

</div>

<div class="total">

Total:
R$ <span id="total">0</span>

</div>

<button onclick="finalizar()">
FINALIZAR PEDIDO
</button>

</div>

<script>

let total=0;

localStorage.removeItem("pedido");

function add(v){

total+=v;

document.getElementById(
"total"
).innerHTML=
total.toFixed(2);

}

function extra(v){

total += v;

document.getElementById("total").innerHTML =
total.toFixed(2);

} 

function finalizar() {

const cliente =
JSON.parse(localStorage.getItem("cliente"));

cliente.referencia =
cliente.referencia || "";

let taxaEntrega = 3; // altere aqui

let msg =
"PECAI MACAPARANA\n" +
"━━━━━━━━━━━━━━\n\n" +

"CLIENTE\n" +
"Nome: " + cliente.nome + "\n" +
"Telefone: " + cliente.fone + "\n" +
"Endereco: " + cliente.endereco + "\n" +
"Referencia: " + cliente.referencia + "\n\n" +

"PEDIDO\n" +
"1x Acai Gourmet\n\n" +

"TAMANHO\n" +
"1x 330ML\n\n" +

"ACOMPANHAMENTOS\n" +
"- Leite condensado\n" +
"- Granola\n\n" +

"━━━━━━━━━━━━━━\n" +

"Subtotal: R$ " + total + "\n" +
"Taxa entrega: R$ " + taxaEntrega + "\n" +
"TOTAL: R$ " + (total + taxaEntrega) + "\n\n" +

"Pagamento: Pix\n\n" +

"Obrigado por escolher a PECAI";
fetch("https://script.google.com/macros/s/AKf.../exec", {
method: "POST",
mode: "no-cors",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify({
pedido: Date.now(),
data: new Date().toLocaleString(),
loja: "Macaparana",
cliente: cliente.nome,
telefone: cliente.fone,
endereco: cliente.endereco,
referencia: cliente.referencia,
pedidoTexto: msg,
subtotal: total,
taxa: taxaEntrega,
total: total + taxaEntrega,
pagamento: "Pix",
status: "NOVO"
})
});

window.open(
"https://wa.me/5581995693080?text=" +
encodeURIComponent(msg),
"_blank"
);

}
</script>

</body>

</html>
